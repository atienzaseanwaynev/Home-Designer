<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/40132d47ff.js" crossorigin="anonymous"></script>
    <title>Front</title>
    <link rel="website icon" type="png" href="/img/House Logo.png">
</head>
<body>
    <img src="/img/House Logo.png" alt="logo" width="300px;" height="100px;">
    <h2>Elevating Living Spaces,<br>Crafting Dreams</h2>
    
      <center>
        <div class="button">
      <a href="Home.html">OPEN PAGE</a>
        </div>
      </center>  
       
      <div class="form-box" method="POST">
        <h1 id="title">Sign Up</h1>
        <form>
          <div class="input-group">
            <div class="input-field"  id="nameField">
              <i class="fa-solid fa-user"></i>
              <input type="text" placeholder="Name" name="name" required>
            </div>

            <div class="input-field">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" placeholder="Email" name="email" required>
            </div>

            <div class="input-field">
              <i class="fa-solid fa-lock"></i>
              <input type="password" placeholder="Password" name="password" required>
            </div>

            <p>Lost password <a href="#">Click Here</a></p>
          </div>
          
          <div class="btn-field">
            <button type="button" id="signupBtn">Sign up</button>
            <button type="button" id="signinBtn" class="disable">Sign in</button>
          </div>
        </form>
      </div>
   <script src="index.js"></script>
</body>
</html>
